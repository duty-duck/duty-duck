_version: 2

# E-mail subjects

## Invitation e-mail
invitationEmailTitle:
    en: "You are invited to join %{org} on DutyDuck"
    fr: "Vous êtes invité à rejoindre %{org} sur DutyDuck"

## Http monitor incident email
newHttpMonitorIncidentEmailSubject:
    en: "New incident for URL %{url}"
    fr: "Nouvel incident pour l'URL %{url}"

## Scheduled task incident email
newScheduledTaskIncidentEmailSubject:
    en: "The scheduled task '%{taskName}' is not running"
    fr: "La tâche planifiée '%{taskName}' ne démarre pas"

# Task run incident email
newTaskRunIncidentEmailSubject:
    en: "A task run for task '%{taskName}' has failed"
    fr: "Une éxécution de la tâche '%{taskName}' a échoué"

# Push notifications

## Http monitor incidents
newHttpMonitorIncidentPushNotificationTitle:
    en: "New incident for URL %{url}"
    fr: "Nouvel incident pour l'URL %{url}"
newHttpMonitorIncidentPushNotificationBody:
    en: "An HTTP monitor for the URL %{url} is down. Head over to DutyDuck to investigate the incident."
    fr: "Un moniteur HTTP pour l'url %{url} est en panne. Rendez-vous sur DutyDuck pour investiguer l'incident."

## Scheduled task incidents
newScheduledTaskIncidentPushNotificationTitle:
    en: "The scheduled task %{taskName} is failing"
    fr: "La tâche planifiée %{taskName} échoue"
newScheduledTaskIncidentPushNotificationBody:
    en: "The scheduled task %{taskName} should be running but it isn't. Head over to DutyDuck to investigate the incident."
    fr: "La tâche planifiée %{taskName} devrait être en cours d'exécution mais elle ne l'est pas. Rendez-vous sur DutyDuck pour investiguer l'incident."

## Task run incidents
newTaskRunIncidentPushNotificationTitle:
    en: "A task run for task '%{taskName}' has failed"
    fr: "Une éxécution de la tâche '%{taskName}' a échoué"
newTaskRunIncidentPushNotificationBody:
    en: "A task run for task '%{taskName}' has failed. Head over to DutyDuck to investigate the incident."
    fr: "Une éxécution de la tâche '%{taskName}' a échoué. Rendez-vous sur DutyDuck pour investiguer l'incident."

# SMS 
smsPhoneNumberVerificationCode:
    en: "DutyDuck - Your verification code is %{code}"
    fr: "DutyDuck - Votre code de vérification est %{code}"
