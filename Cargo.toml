[workspace]
edition = "2021"
resolver = "2"
members = [
    "components/server",
    "components/cli",
    "components/dutyduck-api-client-rs",
    "components/ingestor",
    "components/quickwit-client-rs",
]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
dutyduck-api-client-rs = { path = "components/dutyduck-api-client-rs" }
quickwit-client-rs = { path = "components/quickwit-client-rs" }

itertools = "0.13.0"
axum = "0.8.1"
envconfig = "0.10.0"
thiserror = "1.0.61"
url = "2.5.3"
cron = "0.14.0"
chrono-tz = "0.10.0"
chrono = { version = "0.4.38", features = ["serde"] }
uuid = { version = "1.9", features = ["serde", "v4"] }
futures = "0.3.30"
futures-util = "0.3.30"
anyhow = "1.0.86"
tokio = { version = "1.38.0", features = ["full"] }
tokio-util = { version = "0.7.13", features = ["io", "codec"] }
reqwest = { version = "0.12.5", features = ["json", "stream"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.140"
serde_with = "3.11.0"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
dotenv = "0.15.0"
tonic = "0.12.3"
prost = "0.13.3"
moka = { version = "0.7.1", features = ["future"] }
opentelemetry-proto = { version = "=0.28.0", features = [
    "gen-tonic",
    "with-serde",
    "logs",
] }
